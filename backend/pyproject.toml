[project]
name = "pawdesk-backend"
version = "0.1.0"
description = "PawDesk API: booking intake, agents, and tracing"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.143.0",
    "openai>=3.29.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "playwright>=1.64.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
# Live tests call the real model and cost money: opt in with `pytest -m live`.
addopts = ["--strict-markers", "-p", "pytester", "-m", "not live"]
markers = [
    "spec(capability, requirement): links a test to the OpenSpec requirement it verifies",
    "live: calls the real model provider (costs money; run with -m live)",
]
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py312"
